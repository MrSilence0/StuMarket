<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Correo | StuMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #4e73df;
            --bg-color: #f4f7f6;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .verification-card {
            background: white;
            border-radius: 25px;
            border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .icon-circle-verify {
            width: 100px;
            height: 100px;
            background: rgba(78, 115, 223, 0.1);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .code-input {
            letter-spacing: 10px;
            font-size: 2rem !important;
            border-radius: 15px !important;
            border: 2px solid #d1d3e2 !important;
            color: var(--primary-color) !important;
        }

        .code-input:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.1) !important;
        }

        .btn-verify-custom {
            background: linear-gradient(135deg, var(--primary-color), #224abe);
            border: none;
            color: white;
            padding: 15px;
            transition: 0.3s;
        }

        .btn-verify-custom:hover {
            filter: brightness(1.1);
            color: white;
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
            transform: translateY(-2px);
        }

        .email-display {
            background-color: #f8f9fc;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            border: 1px dashed #d1d3e2;
        }
    </style>
</head>
<body>

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="verification-card p-4 p-md-5 text-center shadow-lg" style="max-width: 500px; width: 100%;">
        
        <div class="mb-4">
            <h3 class="fw-bold text-primary mb-5">StuMarket</h3>
            <div class="icon-circle-verify mb-4">
                <i class="bi bi-envelope-check" style="font-size: 3.5rem;"></i>
            </div>
        </div>
        
        <h2 class="fw-bold text-dark mb-2">Verifica tu correo</h2>
        <p class="text-muted mb-4 small px-2">
            Hemos enviado un código de 6 dígitos al correo electrónico:
            <br>
            <span class="email-display mt-2 fw-bold text-dark">{{ email }}</span>
        </p>
        
        <form action="{% url 'confirmar_email' %}" method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-4 px-md-4">
                <label class="form-label small fw-bold text-muted mb-3">Introduce el código aquí:</label>
                <input type="text" name="codigo_ingresado" 
                       class="form-control form-control-lg text-center fw-bold code-input" 
                       placeholder="000000" maxlength="6" 
                       pattern="\d{6}" inputmode="numeric" required>
            </div>

            <div class="d-grid gap-2 mb-4">
                <button type="submit" class="btn btn-verify-custom rounded-pill fw-bold btn-lg">
                    Verificar y Actualizar
                </button>
            </div>
        </form>

        <div class="pt-2 border-top">
            <p class="small text-muted mb-0">
                ¿No recibiste el código? <br>
                <a href="#" class="text-primary text-decoration-none fw-bold">Reenviar código</a> 
                <span class="mx-1">|</span>
                <a href="{% url 'perfil' %}" class="text-muted text-decoration-none small">Cancelar</a>
            </p>
        </div>

        <div class="mt-4">
            <p class="text-muted" style="font-size: 10px;">
                © 2026 StuMarket - Universidad Tecnológica
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
